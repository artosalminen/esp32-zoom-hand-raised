; Hand signal device firmware, version 1.
; Board: ESP32-C3 "super mini" style board with a 0.42" 72x40 SSD1306 OLED.

[env:esp32c3-oled]
; pioarduino (Arduino core 3.x): native toolchains for Windows, Linux and Apple Silicon.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; 3 MB app partition, no over-the-air updates (the image is about 1.2 MB).
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Uncomment and adjust to drive an external WS2812 RGB LED for the three state colours.
  ; -DRGB_LED_PIN=4
lib_deps =
  olikraus/U8g2@2.35.30
  adafruit/Adafruit NeoPixel@1.12.3
